<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1528"/>
      <stop offset="50%" stop-color="#15151b"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- browser chrome -->
  <rect width="800" height="42" fill="#1e1e24" rx="18" ry="18"/>
  <rect y="18" width="800" height="24" fill="#1e1e24"/>
  <circle cx="22" cy="21" r="5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5" fill="#eab308"/>
  <circle cx="62" cy="21" r="5" fill="#22c55e"/>
  <rect x="280" y="10" width="240" height="22" rx="6" fill="#2a2a32"/>
  <text x="400" y="25" text-anchor="middle" fill="#666" font-size="11" font-family="system-ui">studiomebel.ru</text>

  <!-- hero area -->
  <rect y="42" width="800" height="220" fill="#1a1528"/>

  <!-- navigation bar -->
  <rect x="60" y="58" width="180" height="10" rx="5" fill="#a855f7" opacity="0.6"/>
  <rect x="300" y="58" width="60" height="10" rx="5" fill="#ffffff" opacity="0.15"/>
  <rect x="380" y="58" width="70" height="10" rx="5" fill="#ffffff" opacity="0.15"/>
  <rect x="470" y="58" width="80" height="10" rx="5" fill="#ffffff" opacity="0.15"/>
  <rect x="680" y="52" width="60" height="22" rx="6" fill="#a855f7" opacity="0.4"/>

  <!-- hero headline -->
  <rect x="60" y="110" width="320" height="18" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="60" y="140" width="260" height="18" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="60" y="180" width="200" height="12" rx="4" fill="#ffffff" opacity="0.3"/>
  <rect x="60" y="200" width="220" height="12" rx="4" fill="#ffffff" opacity="0.3"/>

  <!-- hero CTA -->
  <rect x="60" y="228" width="120" height="26" rx="6" fill="#a855f7"/>

  <!-- image placeholder -->
  <rect x="440" y="100" width="300" height="140" rx="12" fill="#ffffff" opacity="0.06"/>

  <!-- content section -->
  <rect y="262" width="800" height="238" fill="#0f0f14"/>
  <rect x="60" y="290" width="180" height="14" rx="4" fill="#a855f7" opacity="0.5"/>
  <rect x="60" y="318" width="140" height="10" rx="4" fill="#ffffff" opacity="0.7"/>
  <rect x="60" y="340" width="680" height="8" rx="4" fill="#ffffff" opacity="0.15"/>
  <rect x="60" y="356" width="600" height="8" rx="4" fill="#ffffff" opacity="0.15"/>
  <rect x="60" y="372" width="640" height="8" rx="4" fill="#ffffff" opacity="0.15"/>

  <!-- cards row -->
  <rect x="60" y="400" width="200" height="70" rx="8" fill="#1e1e24"/>
  <rect x="280" y="400" width="200" height="70" rx="8" fill="#1e1e24"/>
  <rect x="500" y="400" width="200" height="70" rx="8" fill="#1e1e24"/>
</svg>
