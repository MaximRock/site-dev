<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1825"/>
      <stop offset="50%" stop-color="#15151b"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- browser chrome -->
  <rect width="800" height="42" fill="#1e1e24" rx="18" ry="18"/>
  <rect y="18" width="800" height="24" fill="#1e1e24"/>
  <circle cx="22" cy="21" r="5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5" fill="#eab308"/>
  <circle cx="62" cy="21" r="5" fill="#22c55e"/>
  <rect x="280" y="10" width="240" height="22" rx="6" fill="#2a2a32"/>
  <text x="400" y="25" text-anchor="middle" fill="#666" font-size="11" font-family="system-ui">onlineschool.ru</text>

  <!-- header -->
  <rect y="42" width="800" height="50" fill="#1a1825"/>
  <rect x="60" y="56" width="160" height="10" rx="5" fill="#a855f7" opacity="0.5"/>
  <rect x="480" y="56" width="55" height="10" rx="5" fill="#ffffff" opacity="0.15"/>
  <rect x="550" y="56" width="70" height="10" rx="5" fill="#ffffff" opacity="0.15"/>
  <rect x="630" y="56" width="65" height="10" rx="5" fill="#ffffff" opacity="0.15"/>
