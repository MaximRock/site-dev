  <!-- hero -->
  <rect x="60" y="118" width="300" height="18" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="60" y="148" width="340" height="18" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="60" y="190" width="220" height="12" rx="4" fill="#ffffff" opacity="0.3"/>
  <rect x="60" y="210" width="260" height="12" rx="4" fill="#ffffff" opacity="0.3"/>
  <rect x="60" y="240" width="150" height="30" rx="8" fill="#a855f7" opacity="0.6"/>

  <!-- hero image placeholder -->
  <rect x="450" y="108" width="300" height="180" rx="12" fill="#ffffff" opacity="0.06"/>

  <!-- programs section -->
  <rect y="290" width="800" height="210" fill="#0f0f14"/>
  <rect x="60" y="318" width="200" height="14" rx="4" fill="#a855f7" opacity="0.5"/>
  <rect x="60" y="346" width="120" height="8" rx="4" fill="#ffffff" opacity="0.7"/>

