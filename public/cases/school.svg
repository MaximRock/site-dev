  <rect x="80" y="386" width="100" height="6" rx="3" fill="#ffffff" opacity="0.5"/>
  <rect x="80" y="400" width="280" height="6" rx="3" fill="#ffffff" opacity="0.15"/>
  <rect x="440" y="386" width="120" height="6" rx="3" fill="#ffffff" opacity="0.5"/>
  <rect x="440" y="400" width="260" height="6" rx="3" fill="#ffffff" opacity="0.15"/>

  <!-- bottom card -->
  <rect x="60" y="440" width="680" height="40" rx="8" fill="#1a1825"/>
  <rect x="80" y="452" width="180" height="6" rx="3" fill="#ffffff" opacity="0.4"/>
  <rect x="80" y="464" width="500" height="6" rx="3" fill="#ffffff" opacity="0.12"/>
