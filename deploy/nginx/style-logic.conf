upstream style_logic_app {
    server 127.0.0.1:4321;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name style-logic.ru www.style-logic.ru;

    return 301 https://style-logic.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.style-logic.ru;

    ssl_certificate /etc/letsencrypt/live/style-logic.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/style-logic.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://style-logic.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name style-logic.ru;

    ssl_certificate /etc/letsencrypt/live/style-logic.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/style-logic.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    root /srv/site/current/dist/client;
    index index.html;
    client_max_body_size 1m;

    include /etc/nginx/snippets/style-logic-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    error_page 404 /404.html;
    error_page 429 = @rate_limited;

    location = /api/send-lead {
        limit_req zone=send_lead burst=5 nodelay;
        include /etc/nginx/snippets/style-logic-app.conf;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/style-logic-app.conf;
    }

    location ^~ /promo/pekarnya/ {
        root /srv/www;
        index index.html;
        try_files $uri $uri/ =404;
        error_page 404 /promo/pekarnya/404.html;

        add_header X-Robots-Tag "noindex, follow" always;
        include /etc/nginx/snippets/style-logic-headers.conf;

        location ~* ^/promo/pekarnya/(?:_astro|images)/ {
            expires 30d;
            try_files $uri =404;
        }
    }

    location ^~ /promo/shkola-manikyura/ {
        root /srv/www;
        index index.html;
        try_files $uri $uri/ =404;
        error_page 404 /promo/shkola-manikyura/404.html;

        add_header X-Robots-Tag "noindex, follow" always;
        include /etc/nginx/snippets/style-logic-headers.conf;

        location ~* ^/promo/shkola-manikyura/(?:_astro|images)/ {
            expires 30d;
            try_files $uri =404;
        }
    }

    location ^~ /promo/kofeynya/ {
        root /srv/www;
        index index.html;
        try_files $uri $uri/ =404;
        error_page 404 /promo/kofeynya/404.html;

        add_header X-Robots-Tag "noindex, follow" always;
        include /etc/nginx/snippets/style-logic-headers.conf;

        location ~* ^/promo/kofeynya/(?:_astro|images)/ {
            expires 30d;
            try_files $uri =404;
        }
    }

    location ~* \.(?:css|js|mjs|woff2?|webp|avif|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"ok":false,"message":"Слишком много запросов. Попробуйте позже."}';
    }
}
