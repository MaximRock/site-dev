name: uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check main site
        run: curl -fsS --retry 2 --retry-delay 5 --max-time 15 -o /dev/null https://style-logic.ru/

      - name: Check promo
        run: curl -fsS --retry 2 --retry-delay 5 --max-time 15 -o /dev/null https://style-logic.ru/promo/pekarnya/

      - name: Check lead API
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 2 --retry-delay 5 --max-time 15 -o /dev/null -w '%{http_code}' \
            -X POST https://style-logic.ru/api/send-lead \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "lead API HTTP ${code}"
          test "${code}" = "400"

      - name: Open uptime issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Uptime check failed";
            const { owner, repo } = context.repo;
            const issues = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const existing = issues.data.find(issue => issue.title.startsWith(title));
            if (existing) return;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner,
              repo,
              title: `${title}: ${new Date().toISOString()}`,
              body: `The scheduled uptime check failed.\n\nRun: ${runUrl}`
            });

      - name: Close resolved uptime issue
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Uptime check failed";
            const { owner, repo } = context.repo;
            const issues = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            for (const issue of issues.data.filter(item => item.title.startsWith(title))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: "Uptime checks are passing again."
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: "closed"
              });
            }
